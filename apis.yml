aid: acquco
name: Acquco
description: 'Acquco is a New York City based acquirer and operator of Amazon third-party
  (FBA) e-commerce brands, founded in 2020 by former Amazon operators Raunak Nirmal and
  Haumin Lum and backed by roughly $160M in Series A equity and debt from CoVenture,
  Crossbeam and Crosslink Capital. The company buys established Amazon seller businesses —
  closing in an average of about 23 days — then migrates them onto its own operating stack
  and scales them across Amazon, Walmart, Target Plus and DTC channels. That stack is
  productized as Sellerfusion (sellerfusion.io, "powered by Acquco"), a multi-marketplace
  seller operations platform for analytics, automation, monitoring, PPC and financial
  reconciliation, which integrates with Amazon Seller Central and the Amazon Selling Partner
  API (SP-API), Shopify, Walmart Marketplace, Target Plus and NetSuite ERP. Acquco is
  therefore an API CONSUMER rather than an API producer: it publishes no public API,
  developer portal, OpenAPI/GraphQL contract, SDK or webhook surface of its own, and its
  Sellerfusion enterprise tier offers "custom API integrations" only as bespoke, sales-gated
  work. It does publish a substantive Security & Trust page covering its security program,
  incident response and Amazon DPP / GDPR / CCPA compliance posture.'
